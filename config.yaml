# --- Branch identity (Option A: multi-branch, one server per site) ---
# Copy this whole project to each site's mini-PC and change ONLY this
# block plus the camera IPs below. Every uploaded clip is tagged with
# these values so one cloud account holds all branches, cleanly separated.
branch:
  id: "onnut"                 # short code, e.g. thl / r9 / rama9
  name: "KROSS ONNUT"    # human-readable, shown in the UI

system:
  buffer_dir: "./buffer"
  clips_dir: "./clips"
  segment_seconds: 5
  segment_wrap: 24          # 24 x 5s = 120s rolling window per camera
  clip_seconds: 40          # highlight length
  cooldown_seconds: 50      # min gap between accepted triggers, per court
  encoder: "qsv"            # windows Intel iGPU. mac -> "videotoolbox"; ubuntu -> "qsv"; fallback -> "libx264"
  output_height: 1080       # clips are downscaled to this (0 = keep camera resolution)
  video_bitrate: "8M"       # enough for 1080p50; ~20-40 MB per 40s clip
  stale_after_seconds: 15
  http_port: 8000

# Four cameras. For now they point at the MediaMTX test stream so you can see
# the app work before real hardware arrives. Add more streams in MediaMTX
# (cam2, cam3, cam4) or just leave them pointing at cam1 to test the grid.
cameras:
  - id: court_1
    court: court_1
    name: Court 1
    enabled: true
    source_type: rtsp
    source: rtsp://localhost:8554/court_1
courts:
  court_1:
    display_name: Court 1
    primary_cam: court_1
    button_token: onnut-court_1-ac8761
  
